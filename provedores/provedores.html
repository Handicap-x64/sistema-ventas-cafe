<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores</title>
    <script defer src="provedores.js?v=2"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Proveedores</h1>
    <table id="tablaProvedores" class="tablaProvedores">
        <thead>
            <tr>
                <th rowspan="2">ID</th>
                <th rowspan="2">RIF</th>
                <th rowspan="2">Proveedor</th>
                <th colspan="4">Contacto</th>
                <th rowspan="2">Acción</th>
            </tr>
            <tr>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Correo</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    <p id="mensajeProveedores" role="status" aria-live="polite"></p>

    <div class="tabs">
        <button class="tab activo" data-tab="agregar">Agregar Proveedor</button>
        <button class="tab" data-tab="modificar">Modificar datos del contacto</button>
    </div>

    <div id="agregar" class="tab-contenido activo">
        <h2>Agregar Proveedor</h2>
        <form id="formAgregar">
            <label for="rif">RIF</label>
            <input id="rif" type="text" name="rif" placeholder="J-12345678" required>
            <label for="nombre">Nombre del proveedor</label>
            <input id="nombre" type="text" name="nombre" placeholder="Nombre del proveedor" required>
            <label for="nombre_con">Nombre del contacto</label>
            <input id="nombre_con" type="text" name="nombre_con" placeholder="Nombre del contacto" required>
            <label for="cedula_con">Cédula del contacto</label>
            <input id="cedula_con" type="text" name="cedula_con" placeholder="V-12345678" required>
            <label for="telefono_con">Teléfono del contacto</label>
            <input id="telefono_con" type="tel" name="telefono_con" placeholder="Teléfono del contacto" required>
            <label for="email_con">Correo del contacto</label>
            <input id="email_con" type="email" name="email_con" placeholder="Correo del contacto" required>
            <button type="submit">Guardar</button>
        </form>
    </div>

    <div id="modificar" class="tab-contenido">
        <h2>Modificar datos del contacto</h2>
        <form id="formModificar">
            <label for="idEntidad">Proveedor</label>
            <select id="idEntidad" name="idEntidad" required>
                <option value="">Seleccione un proveedor</option>
            </select>
            <label for="modificar_nombre_con">Nombre del contacto</label>
            <input id="modificar_nombre_con" type="text" name="nombre_con" placeholder="Nombre del contacto" required>
            <label for="modificar_cedula_con">Cédula del contacto</label>
            <input id="modificar_cedula_con" type="text" name="cedula_con" placeholder="V-12345678" required>
            <label for="modificar_telefono_con">Teléfono del contacto</label>
            <input id="modificar_telefono_con" type="tel" name="telefono_con" placeholder="Teléfono del contacto" required>
            <label for="modificar_email_con">Correo del contacto</label>
            <input id="modificar_email_con" type="email" name="email_con" placeholder="Correo del contacto" required>
            <button type="submit">Actualizar</button>
        </form>
    </div>

    <a href="../home.html" class="btn-volver">Volver al inicio</a>
</body>
</html>
